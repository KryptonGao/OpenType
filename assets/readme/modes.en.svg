<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" lang="en" xml:lang="en" role="img" aria-labelledby="t d">
  <title id="t">Three voice sessions</title>
  <desc id="d">Dictation: tap ⌃⌥ Space to start and again to finish. Translation: press ⌃⌥ T. Say It for Me: hold the dictation shortcut for about 0.45 seconds, release to finish.</desc>
  <defs>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="#0B1331"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="27.5" fill="none" stroke="#22305F"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Card 1 -->
    <g transform="translate(40 40)">
      <rect width="350" height="220" rx="20" fill="#121C44" stroke="#2A3A70"/>
      <g fill="#63A4FF"><rect x="30" y="38" width="8" height="16" rx="4"/><rect x="46" y="30" width="8" height="32" rx="4"/><rect x="62" y="24" width="8" height="44" rx="4"/><rect x="78" y="32" width="8" height="28" rx="4"/></g>
      <text x="106" y="56" font-size="30" font-weight="800" fill="#F4F7FF">Dictation</text>
      <text x="30" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#FFC15E">Tap ⌃⌥ Space</text>
      <text x="30" y="156" font-size="20" fill="#C4CFF0">Cleans up and punctuates,</text>
      <text x="30" y="188" font-size="20" fill="#C4CFF0">then inserts at the cursor</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(425 40)">
      <rect width="350" height="220" rx="20" fill="#121C44" stroke="#2A3A70"/>
      <g fill="none" stroke="#63A4FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 40 H76 M64 28 L76 40 L64 52"/><path d="M80 62 H34 M46 50 L34 62 L46 74" transform="translate(0 -6)"/>
      </g>
      <text x="106" y="56" font-size="30" font-weight="800" fill="#F4F7FF">Translation</text>
      <text x="30" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#FFC15E">Press ⌃⌥ T</text>
      <text x="30" y="156" font-size="20" fill="#C4CFF0">Cleans up, then translates</text>
      <text x="30" y="188" font-size="20" fill="#C4CFF0">into 15 target languages</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(810 40)">
      <rect width="350" height="220" rx="20" fill="#121C44" stroke="#FFC15E" stroke-opacity="0.7"/>
      <g fill="url(#caret)"><rect x="46" y="22" width="6" height="44" rx="3"/><rect x="36" y="22" width="26" height="5" rx="2.5"/><rect x="36" y="61" width="26" height="5" rx="2.5"/></g>
      <text x="106" y="56" font-size="30" font-weight="800" fill="#F4F7FF">Say It for Me</text>
      <text x="30" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#FFC15E">Hold ⌃⌥ Space</text>
      <text x="30" y="156" font-size="20" fill="#C4CFF0">Turns a casual remark into</text>
      <text x="30" y="188" font-size="20" fill="#C4CFF0">a ready-to-send message</text>
    </g>
  </g>
</svg>
